databases:
  - name: clever-work-db
    databaseName: clever_work
    user: clever_work
    plan: free

services:
  - type: web
    name: clever-work
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: clever-work-db
          property: connectionString
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: LEAD_WEBHOOK_URL
        sync: false
